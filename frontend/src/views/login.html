<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Font chữ-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <title>Web Y Khoa</title>
    <!-- Nhúng file CSS mà Tailwind biên dịch ra -->
    <link href="../../../dist/output.css" rel="stylesheet">
    <!--Icon-->
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
    <!--Hiệu ứng cuộn-->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
</head>

<body class="bg-[rgb(132,197,228)] h-screen">
    <header>
        <nav class="mx-10 lg:mt-4 relative z-50">
            <div class="nav-links duration-500 lg:static absolute lg:min-h-fit min-h-[60vh] bottom-0 lg:translate-y-0 -translate-y-full lg:w-auto w-full flex items-center bg-white lg:bg-[#84C5E4]">
                <ul class="flex lg:flex-row flex-col gap-6 items-center w-full">
                    <li>
                        <a href="index.html" class="lg:text-white text-[#56ADD7] text-[20px] font-medium hover:underline hover:underline-offset-8 decoration-[3px]">Home</a>
                    </li>
                    <li>
                        <a href="about.html" class="lg:text-white text-[#56ADD7] text-[20px] font-medium hover:underline hover:underline-offset-8 decoration-[3px]">About us</a>
                    </li>
                    <li>
                        <a href="#" class="lg:text-white text-[#56ADD7] text-[20px] font-medium hover:underline hover:underline-offset-8 decoration-[3px]">How it works</a>
                    </li>
                    <li>
                        <a href="login.html" class="lg:text-[#56ADD7] text-white text-[25px] font-medium lg:bg-white bg-[#56ADD7] rounded-[99px] px-6">Log in/Sign in</a>
                    </li>
                </ul>
            </div>
            <div class="flex justify-end items-center">
                <ion-icon name="menu-outline" onclick="onToggleMenu(this)" class="text-5xl text-white text-bold cursor-pointer lg:hidden"></ion-icon>
            </div>
        </nav>
    </header> 

    <main>
        <!--Khối chính chứa tiêu đề, nút Explore và hình ảnh-->
        <div class="flex lg:flex-row flex-col items-center justify-center gap-18 h-screen lg:mx-16">
            <!--Khối bên trái chứa tiêu đề và nút Explore-->
            <div class="flex flex-col items-center lg:items-stretch justify-center gap-12">
                <!--Khối tiêu đề-->
                <div class="flex flex-col" data-aos="fade-right">  
                    <p class="text-white text-[55px] font-semibold lg:text-right text-center">Save your progress</p>
                    <p class="text-white text-[55px] font-semibold lg:text-right text-center">and get</p>
                    <p class="text-white text-[55px] font-semibold lg:text-right text-center">personalized guides!</p>
                </div>
                <!--Khối nút Explore-->
                <a href="#" data-aos="fade-right">
                    <button class="text-[25px] text-[#253464] font-medium bg-[#C4DDE9] px-14 py-3 rounded-[99px] shadow-[0_12px_4px_0_#4D5F99] cursor-pointer transition-all
  hover:translate-y-0.5">Get started
                    </button>
                </a>
            </div>
            <!--Khối bên phải chứa hình ảnh-->
            <div class="hidden lg:block" data-aos="fade-left">
                <img src="../asset/home.webp" class="w-100 h-100 object-cover">
            </div> 
        </div>

        <!--Khối màu xanh nhạt-->
        <section class="flex h-screen flex-col">
            <div>
                <!--Khối nội dung phụ-->
                <div class="bg-[#C4DDE9] pt-12 pb-24 text-center">
                    <div class="flex flex-col justify-center gap-4 text-[30px] font-medium text-[#253464]">
                        <p>Designed for You</p>
                    </div>
                </div>

                <!--Khối tròn-->
                <div class="flex justify-around items-end -mt-20 bg-[#C4DDE9] h-32 w-full">
                    <div class="bg-[#EFEEE5] lg:h-24 lg:w-48 h-20 w-36 rounded-t-full relative">
                        <ion-icon name="bookmark" class="text-[#8FC4E4] lg:text-[70px] text-[60px] absolute lg:-bottom-1/5 lg:left-15.5 left-10.5 -bottom-1/4"></ion-icon>
                    </div>
                    <div class="bg-[#EFEEE5] lg:h-24 lg:w-48 h-20 w-36 rounded-t-full relative">
                        <ion-icon name="download" class="text-[#8FC4E4] lg:text-[70px] text-[60px] absolute lg:-bottom-1/4 lg:left-15.5 left-10.5 -bottom-1/4"></ion-icon>
                    </div>
                    <div class="bg-[#EFEEE5] lg:h-24 lg:w-48 h-20 w-36 rounded-t-full relative">
                        <ion-icon name="happy" class="text-[#8FC4E4] lg:text-[70px] text-[60px] absolute lg:-bottom-1/5 lg:left-16 left-11 -bottom-1/5"></ion-icon>
                    </div>
                </div>
            </div>
            <!--Khối thông tin liên lạc-->
            <div class="flex flex-1 bg-[#EFEEE5]">
                <div class="flex flex-row w-full justify-around items-center lg:pb-20 pb-30">
                    <!--Save-->
                    <div class="font-medium text-[#253464] lg:text-[27px] text-[20px] flex flex-col items-center justify-center w-70">
                        <p>Log your</p>
                        <p>latest reports</p>
                    </div>
                    <!--Export-->
                    <div class="font-medium text-[#253464] lg:text-[25px] text-[20px] flex flex-col items-center justify-center w-72">
                        <p>Export PDF Report </p>
                        <p>for your doctor</p>
                    </div>
                    <!--Check-in-->
                    <div class="font-medium text-[#253464] lg:text-[27px] text-[20px] flex flex-col items-center justify-center w-66">
                        <p>Automated Buddy</p>
                        <p>Check-ins</p>
                    </div>
                </div>
            </div>
        </section>
        
        
    </main>
    <script src="../components/navbar.js"></script>
    <!--Hiệu ứng AOS-cuộn-->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 1000, // Thời gian hiệu ứng (1 giây)
            once: true      // Chỉ chạy animation 1 lần khi cuộn tới
        });
    </script>
</body>

</html>
